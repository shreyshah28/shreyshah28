<svg width="1180" height="610" viewBox="0 0 1180 610" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shrey Shah - AI/ML Developer &amp; Full-Stack Engineer Profile Banner">
  <defs>
